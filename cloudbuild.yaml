# ==============================================================================
# Pipeline de CI/CD para Google Cloud Build y Cloud Run (GCP)
# ==============================================================================
steps:
  # 1. Construir la imagen Docker usando Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/siiac-frontend:$COMMIT_SHA', '.']

  # 2. Subir la imagen a Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/siiac-frontend:$COMMIT_SHA']

  # 3. Desplegar en Google Cloud Run de forma Serverless
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'siiac-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/siiac-frontend:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/siiac-frontend:$COMMIT_SHA'

